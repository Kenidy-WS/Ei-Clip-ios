name: Compilar IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Testes da lógica pura (Core)
        working-directory: Core
        run: swift test

  ipa:
    needs: tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto
        run: xcodegen generate

      - name: Compilar sem assinatura
        run: |
          set -o pipefail
          xcodebuild \
            -project EiClip.xcodeproj \
            -scheme EiClip \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      # v0.5.8: relatório de avisos do compilador (não bloqueia; aparece no resumo da execução).
      - name: Relatório de avisos da compilação
        if: always()
        continue-on-error: true
        run: |
          if [ -f build.log ]; then
            COUNT=$(grep -c "warning:" build.log || true)
            {
              echo "### Avisos do compilador: $COUNT"
              echo
              echo '```'
              grep "warning:" build.log | sed "s#$PWD/##" | sort -u | head -40 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # v0.5.8: verificação de estilo (swift-format), só informativa: não bloqueia a compilação.
      - name: Verificar estilo (informativo)
        continue-on-error: true
        run: |
          {
            echo "### Estilo (swift-format, informativo)"
            echo
            echo '```'
            swift format lint --recursive App Engine Core/Sources Core/Tests 2>&1 | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Montar o IPA (não assinado)
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/EiClip.app Payload/
          zip -qr EiClip.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: EiClip-ipa
          path: EiClip.ipa
          if-no-files-found: error

      - name: Publicar o IPA numa Release (link direto de download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 MARKETING_VERSION project.yml | sed 's/.*"\(.*\)".*/\1/')
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Ei Clip $TAG" \
              --notes "IPA não assinado. Assine na instalação com o Sideloadly."
          fi
          gh release upload "$TAG" EiClip.ipa --clobber
