name: EiClip
options:
  bundleIdPrefix: app
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.9"
    CURRENT_PROJECT_VERSION: "134"
targets:
  EiClip:
    type: application
    platform: iOS
    sources:
      - App
      - Engine
      - Core/Sources/EiClipCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.eiclip
        PRODUCT_NAME: EiClip
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ei Clip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: O Ei Clip usa a câmera para gravar os seus clipes de vídeo.
        NSMicrophoneUsageDescription: O Ei Clip usa o microfone para gravar o som dos clipes e para ouvir o comando de voz.
        NSSpeechRecognitionUsageDescription: O Ei Clip usa o reconhecimento de voz para identificar a palavra de ativação. O processamento é feito no próprio aparelho.
        NSPhotoLibraryUsageDescription: O Ei Clip acessa o álbum "Ei Clip" das suas Fotos para exibir e reproduzir os clipes que você gravou.
        NSPhotoLibraryAddUsageDescription: O Ei Clip salva os seus clipes no álbum "Ei Clip" das suas Fotos.
